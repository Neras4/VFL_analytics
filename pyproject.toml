[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vfl-analytics-engine"
version = "0.2.2"
description = "VFL rules-first, uncertainty-aware analytical research engine"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "jsonschema==4.25.1"]

[project.scripts]
vfl-analyze = "vfl_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["vfl_analytics*"]

[tool.setuptools.package-data]
vfl_analytics = ["data/*.json", "data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rule_reference: direct published example or table lookup",
  "synthetic: artificial arithmetic or regression scenario",
  "observed: actual game data (none provided in this release)",
]
